<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АптекаПлюс — управление запасами</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sb-logo">💊</div>
      <div>
        <div class="sb-title">АптекаПлюс</div>
        <div class="sb-sub">Умные запасы</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="tabs">
      <button data-view="stock" class="active"><span class="sb-icon">📊</span><span>Главная</span></button>
      <button data-view="priority"><span class="sb-icon">🔥</span><span>Приоритетные партии</span><span class="cnt" id="cntPrio">0</span></button>
      <button data-view="loss"><span class="sb-icon">📉</span><span>Прогноз потерь</span><span class="cnt" id="cntLoss">0</span></button>
      <button data-view="purchase"><span class="sb-icon">🛒</span><span>Рекомендации по закупке</span><span class="cnt" id="cntBuy">0</span></button>
    </nav>

    <div class="sidebar-footer">
      <div class="sf-note">💡 Наведи на строку таблицы, чтобы раскрыть детали партии</div>
      <div class="sf-version">v1.0 · АптекаПлюс</div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="head-inner">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input"
                placeholder="Поиск препарата…" autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>

        <div class="settings">
          <label>Период анализа продаж
            <select id="periodPreset">
              <option value="30">1 месяц</option>
              <option value="90">3 месяца</option>
              <option value="180">6 месяцев</option>
              <option value="365" selected>1 год</option>
              <option value="730">2 года</option>
              <option value="1095">3 года</option>
              <option value="custom">📅 Свой период…</option>
            </select>
          </label>
          <div class="date-range" id="customRange" hidden>
            <label>Точный диапазон</label>
            <div class="date-inputs">
              <input type="date" id="dateFrom" />
              <span class="date-sep">—</span>
              <input type="date" id="dateTo" />
              <button type="button" class="date-reset" id="dateReset" title="Сбросить">↺</button>
            </div>
          </div>
          <div class="today">Данные на <b id="todayLabel">…</b></div>
        </div>
      </div>
    </header>

    <div class="content">
      <div id="error"></div>
      <div class="kpis" id="kpis"></div>
      <div class="dashboard" id="dashboard"></div>

      <div id="view-stock" class="view"><div class="loading">Загрузка данных…</div></div>
      <div id="view-priority" class="view" hidden></div>
      <div id="view-loss" class="view" hidden></div>
      <div id="view-purchase" class="view" hidden></div>

      <footer>АптекаПлюс · расчёты на сервере (Python / FastAPI + PostgreSQL)</footer>
    </div>
  </main>

</div>

<script src="/static/app.js"></script>
</body>
</html>
